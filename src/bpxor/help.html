<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дневник давления — инструкция</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--fg:#1c2733;--mut:#5b6b7b;--acc:#2f5d8a;--bd:#d8e0e8;--warn:#b71c1c}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1d242c;--fg:#dfe7ee;--mut:#93a3b3;--acc:#6fa8dc;--bd:#33404d;--warn:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 Tahoma,Verdana,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{background:var(--acc);color:#fff;padding:12px 16px}
header .wrap{display:flex;align-items:center;gap:12px;padding:0}
header b{font-size:18px}
header a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:4px 10px}
h1{font-size:24px;margin:22px 0 6px}
h2{font-size:19px;margin:26px 0 8px;border-bottom:2px solid var(--acc);padding-bottom:4px}
h3{font-size:16px;margin:16px 0 6px}
p,li{margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;margin:10px 0}
.note{border-left:4px solid var(--acc);background:var(--card);padding:8px 12px;margin:10px 0;border-radius:0 8px 8px 0}
.warnb{border-left-color:var(--warn)}
table{border-collapse:collapse;width:100%;margin:10px 0;background:var(--card)}
th,td{border:1px solid var(--bd);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--acc);color:#fff}
code,kbd{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;font-size:13px}
ul,ol{padding-left:22px}
.toc{columns:2;column-gap:24px}
.toc a{color:var(--acc);text-decoration:none}
.tag{display:inline-block;border:1px solid var(--acc);color:var(--acc);border-radius:10px;font-size:12px;padding:0 8px;margin-right:4px;vertical-align:1px}
.desk{border-color:#7b0711;color:#7b0711}
@media (prefers-color-scheme:dark){.desk{border-color:#ff8a80;color:#ff8a80}}
.web{border-color:#1b7f5f;color:#1b7f5f}
@media (prefers-color-scheme:dark){.web{border-color:#7fd8b5;color:#7fd8b5}}
footer{margin:30px 0 20px;color:var(--mut);font-size:13px}
a.back{color:var(--acc)}

#langbar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);box-shadow:0 1px 4px rgba(0,0,0,.15)}
#langbar .wrap{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px}
#langbar button{font:13px Tahoma;padding:4px 10px;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--fg);cursor:pointer}
#langbar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
</style>
</head>
<body>
<div id="langbar"><div class="wrap"></div></div>
<div id="help-content"></div>
<script>
var HL=[["ru","Русский"],["en","English"],["de","Deutsch"],["fr","Français"],["pt","Português"],["es","Español"],["zh","中文"],["ja","日本語"]];
function ratio(){var d=document.documentElement;var max=d.scrollHeight-innerHeight;return max>0?scrollY/max:0;}
function setRatio(r){requestAnimationFrame(function(){var d=document.documentElement;var max=d.scrollHeight-innerHeight;scrollTo(0,Math.round(r*max));});}
async function show(code,keep){
  var r=keep?ratio():0;
  try{
    var resp=await fetch("/help/"+code);if(!resp.ok)throw new Error(code);
    document.getElementById("help-content").innerHTML=await resp.text();
    try{localStorage.setItem("bpxHelpLang",code);}catch(e){}
    document.documentElement.lang=code;
    var bs=document.querySelectorAll("#langbar button");
    for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i].getAttribute("data-c")===code);
    if(keep)setRatio(r);else scrollTo(0,0);
  }catch(e){}
}
window.addEventListener("DOMContentLoaded",function(){
  var bar=document.querySelector("#langbar .wrap");
  bar.innerHTML=HL.map(function(l){return '<button data-c="'+l[0]+'">'+l[1]+'</button>';}).join("");
  var bs=document.querySelectorAll("#langbar button");
  for(var i=0;i<bs.length;i++)bs[i].onclick=function(){show(this.getAttribute("data-c"),true);};
  var lang="ru";try{lang=localStorage.getItem("bpxHelpLang")||localStorage.getItem("bpxLang")||"ru";}catch(e){}
  show(lang,false);
});
</script>
</body>
</html>
