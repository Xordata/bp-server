<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f5d8a">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Дневник АД — вход</title>
<style>
:root{color-scheme:light;--bg:#f6f6f3;--fg:#222;--card:#fff;--bd:#c9c9c4;--mut:#777;--accent:#2f5d8a;--accent-h:#27507a;--warn:#b71c1c}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14161a;--fg:#e8eaf0;--card:#1d2026;--bd:#3a3f48;--mut:#9aa3b5;--accent:#4a7fb5;--accent-h:#5d92c9;--warn:#ff8a80}}
*{box-sizing:border-box}
body{font:13px/1.45 Tahoma,Verdana,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:28px 26px;width:320px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:20px}
label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 4px}
input{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:3px;color:var(--fg);padding:7px 8px;font:inherit}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:20px;padding:8px;border:1px solid var(--accent);border-radius:3px;background:var(--accent);color:#fff;font:inherit;font-size:14px;cursor:pointer}
button:hover{background:var(--accent-h)}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--warn);font-size:13px;margin-top:14px;min-height:18px}
.langs{margin-top:16px;padding-top:14px;border-top:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:3px 9px;justify-content:center}
.langs a{color:var(--mut);font-size:11.5px;text-decoration:none;cursor:pointer;padding:1px 3px;border-radius:3px}
.langs a:hover{color:var(--fg)}
.langs a.on{color:var(--accent);font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>Дневник АД</h1>
<div class="sub">вход по почтовому паролю</div>
<form id="f">
<label>Почта</label>
<input id="login" type="email" autocomplete="username" required>
<label>Пароль</label>
<input id="pass" type="password" autocomplete="current-password" required>
<button id="b" type="submit">Войти</button>
<div class="err" id="e"></div>
</form>
<div class="langs" id="langs"></div>
</div>
<script src="/i18n.js"></script>
<script>
// Язык страницы входа: сохранённый выбор (bpxLang, тот же ключ, что у SPA и help) > язык браузера > ru.
// Переключение = localStorage + reload (тот же приём, что setLang в SPA: live-переобход ненадёжен).
const LANGS=[["ru","Русский"],["en","English"],["de","Deutsch"],["fr","Français"],["pt","Português"],["es","Español"],["zh","中文"],["ja","日本語"]];
var myLang=(function(){
 try{var s=localStorage.getItem("bpxLang");if(s&&LANGS.some(function(l){return l[0]===s;}))return s;}catch(e){}
 var n=(navigator.language||"ru").toLowerCase().slice(0,2);
 return LANGS.some(function(l){return l[0]===n;})?n:"ru";
})();
function pickLang(c){try{localStorage.setItem("bpxLang",c);sessionStorage.setItem("bpxLangPick",c);}catch(e){}location.reload();}
document.documentElement.lang=myLang;
document.getElementById("langs").innerHTML=LANGS.map(function(l){return '<a class="'+(l[0]===myLang?"on":"")+'" onclick="pickLang(\''+l[0]+'\')">'+l[1]+'</a>';}).join("");
loadLang(myLang);
var mq=matchMedia('(prefers-color-scheme:dark)');
(function up(){var m=document.querySelector('meta[name=theme-color]');if(m)m.content=mq.matches?'#14161a':'#2f5d8a';})();
if(mq.addEventListener)mq.addEventListener('change',function(){var m=document.querySelector('meta[name=theme-color]');if(m)m.content=mq.matches?'#14161a':'#2f5d8a';});
document.getElementById('f').onsubmit=async ev=>{
 ev.preventDefault();
 const b=document.getElementById('b'),e=document.getElementById('e');
 b.disabled=true;e.textContent='';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({login:document.getElementById('login').value,pass:document.getElementById('pass').value})});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.ok){
   // Явный выбор языка на входе (клик по панели) пушится в аккаунт — иначе SPA возьмёт серверный cfg.Lang
   // и выбор «подсосётся» обратно. Авто-определение браузера сюда не попадает (маркер ставит только pickLang).
   try{
    var pick=null;try{pick=sessionStorage.getItem("bpxLangPick");sessionStorage.removeItem("bpxLangPick");}catch(e0){}
    if(pick){
     var m=document.cookie.match(/(?:^|;\s*)bpxcsrf=([^;]+)/);
     if(m)await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':m[1]},body:JSON.stringify({Lang:pick})}).catch(function(){});
    }
   }catch(e1){}
   location='/';return;
  }
  e.textContent=j.err?tr(j.err):tr('ошибка')+' '+r.status;
 }catch(ex){e.textContent=tr('сеть недоступна');}
 b.disabled=false;
};
</script>
</body>
</html>
