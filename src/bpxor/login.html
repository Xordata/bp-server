<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Дневник АД — вход</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#14161a;color:#e8eaf0;font-family:system-ui,Arial,sans-serif}
.card{background:#1d2026;border:1px solid #2c313a;border-radius:14px;padding:34px 30px;width:320px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
h1{font-size:19px;margin:0 0 4px}
.sub{color:#8a93a6;font-size:12.5px;margin-bottom:22px}
label{display:block;font-size:12.5px;color:#9aa3b5;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;background:#12141a;border:1px solid #333a46;border-radius:8px;color:#e8eaf0;padding:10px 12px;font-size:15px}
input:focus{outline:none;border-color:#4d7fff}
button{width:100%;margin-top:22px;padding:11px;border:none;border-radius:8px;background:#3b6ef5;color:#fff;font-size:15px;cursor:pointer}
button:hover{background:#4d7fff}
button:disabled{background:#3a4152;cursor:wait}
.err{color:#ff7a7a;font-size:13px;margin-top:14px;min-height:18px}
</style>
</head>
<body>
<div class="card">
<h1>Дневник АД</h1>
<div class="sub">bp.xor.world — вход почтовым паролем @xor.world</div>
<form id="f">
<label>Почта</label>
<input id="login" type="email" autocomplete="username" required>
<label>Пароль</label>
<input id="pass" type="password" autocomplete="current-password" required>
<button id="b" type="submit">Войти</button>
<div class="err" id="e"></div>
</form>
</div>
<script>
document.getElementById('f').onsubmit=async ev=>{
 ev.preventDefault();
 const b=document.getElementById('b'),e=document.getElementById('e');
 b.disabled=true;e.textContent='';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({login:document.getElementById('login').value,pass:document.getElementById('pass').value})});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.ok){location='/';return;}
  e.textContent=j.err||('ошибка '+r.status);
 }catch(ex){e.textContent='сеть недоступна';}
 b.disabled=false;
};
</script>
</body>
</html>
