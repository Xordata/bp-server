	<title>XOR.WORLD</title>
<style>
body, html, #app { 
  margin: 0; 
  width: 100%; 
  height: 100%; 
  background-color: #111; 
  color: #fff; 
  font-family: sans-serif; 
  overflow: hidden; 
}
body { 
  touch-action: none; 
  background-color: #1C1C1C; 
  display: flex; 
  flex-direction: column; 
  justify-content: center; 
  align-items: center; 
  height: 100vh; 
  height: 100dvh; /* мобильные браузеры: высота без учёта URL-бара */
  margin: 0; 
}

.hero { 
  position: relative; 
  height: 100%; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center; 
  gap: 10px; 
  pointer-events: none; 
  z-index: 2; 
}

#canvas { 
  position: fixed; 
  top: 0; 
  right: 0; 
  bottom: 0; 
  left: 0; 
  overflow: hidden; 
  z-index: 1; 
}

:root { 
  --m: clamp(0.95rem, 3.2vw, 1.3rem); /* шрифт кнопок тянется за экраном, но в разумных пределах */
  --red: #8F6565; 
  --pink: #8F64F9; 
  --purple: #4B5FFF; 
  --blue: #2D8AFF; 
  --green: #1BFF89; 
  --yellow: #8FEE55; 
  --orange: #8F6D1B; 
}

/* Кнопки: центрированный ПЕРЕНОСЯЩИЙСЯ ряд — на узких экранах в несколько строк,
   за экран ничего не вылазит (flex-wrap + clamp-шрифт + padding по краям) */
#button-container { 
  position: absolute; 
  inset: 0; 
  display: flex; 
  flex-wrap: wrap; 
  align-content: center; 
  justify-content: center; 
  gap: clamp(10px, 2.5vw, 22px); 
  padding: 16px; 
  box-sizing: border-box; 
  z-index: 10; 
}

button { 
  position: relative; 
  border: calc(0.18 * var(--m)) solid transparent; 
  color: #F3F3F3; 
  font-family: 'Arial'; 
  font-size: var(--m); 
  border-radius: calc(0.7 * var(--m)); 
  padding: calc(0.5 * var(--m)) calc(0.8 * var(--m)); 
  display: flex;  
  align-items: center; 
  justify-content: center;    
  cursor: pointer; 
  white-space: nowrap; 
  background: linear-gradient(#421213, #121213), linear-gradient(#421213 50%, rgba(18, 18, 19, 0.6) 80%, rgba(18, 18, 19, 0)), linear-gradient(90deg, var(--orange), var(--yellow), var(--green), var(--blue), var(--purple), var(--pink), var(--red)); 
  background-origin: border-box; 
  background-clip: padding-box, border-box, border-box; 
  background-size: 200%; 
  animation: animate 2s infinite linear;
} 

/* блик поверх кнопки } и ниже кнопок */
button::before { 
  left: 20%; 
  content: ''; 
  background: linear-gradient(90deg, var(--orange), var(--yellow), var(--green), var(--blue), var(--purple), var(--pink), var(--red)); 
  bottom: -20%; 
  height: 30%; 
  filter: blur(calc(0.8 * var(--m))); 
  opacity: 0.5; 
  position: absolute; 
  z-index: -1; 
  transform: skewX(10deg); 
  width: 60%; 
} 

button:hover, button:hover::before { 
  animation: animate 0.5s infinite linear; 
} 

svg { 
  vertical-align: sub; 
} 

@keyframes animate { 
  0% {background-position: 0} 
  100% {background-position: 200%} 
} 
</style>
</head>
<body>
<div id="app"><canvas id="canvas"></canvas><div class="hero"></div></div>
<div id="button-container"></div>
<footer>
</footer>

document.addEventListener('DOMContentLoaded', () => {
