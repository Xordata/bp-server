# /etc/fail2ban/filter.d/bpxor-login.conf — ловим 401 в access-логе nginx
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "[A-Z]+ [^"]*" 401 
ignoreregex =

# /etc/fail2ban/jail.d/bpxor.conf
[bp-login]
enabled  = true
filter   = bpxor-login
logpath  = /var/log/nginx/bp.access.log
maxretry = 5
findtime = 60
bantime  = 3600
action   = %(banaction)s[namevars=name(bpxor-login)]
