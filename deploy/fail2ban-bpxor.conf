# Этот файл — ДВА фрагмента для разных мест (команды установки: README-deploy.md, шаг 4):
#   1) /etc/fail2ban/filter.d/bpxor-login.conf
#   2) /etc/fail2ban/jail.d/bpxor.conf

# ---------- /etc/fail2ban/filter.d/bpxor-login.conf ----------
# Ловим ТОЛЬКО неверные логины (POST /api/login -> 401). Обычные 401 от /api/*
# (истёкшая сессия у легального пользователя) банить НЕ должны.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "POST /api/login[^"]*" 401 
ignoreregex =

# ---------- /etc/fail2ban/jail.d/bpxor.conf ----------
[bp-login]
enabled  = true
filter   = bpxor-login
logpath  = /var/log/nginx/bp.access.log
maxretry = 5
findtime = 60
bantime  = 3600
banaction = iptables-multiport
action = %(banaction)s[name=%(__name__)s, bantime="%(bantime)s", port="80,443", protocol="tcp", chain="%(chain)s"]
